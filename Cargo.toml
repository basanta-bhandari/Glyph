[package]
name = "glyph-workspace"
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "A configurable terminal workspace for files, applications, and agents"
license = "MIT"

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.28.1"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "error-send"] }
ratatui = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
flate2 = "1.1"
fs2 = "0.4.3"
rand = "0.8"
rpassword = "7.5"
tempfile = "3.12"
zeroize = "1.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
fuser = { version = "0.15.1", default-features = false, features = ["abi-7-31"] }
libc = "0.2"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
